name: Documentation and repository quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required public files
        shell: bash
        run: |
          set -e
          test -f README.md
          test -f index.html
          test -f CONTRIBUTING.md
          test -f docs/SECURITE.md
          test -f structure.md

      - name: Scan common accidental secrets
        run: |
          python3 - <<'PY'
          import pathlib
          import re
          import sys

          patterns = {
              "private key": r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----",
              "GitHub token": r"\bgh[pousr]_[A-Za-z0-9_]{20,}\b",
              "AWS access key": r"\b(?:AKIA|ASIA)[A-Z0-9]{16}\b",
              "generic bearer": r"(?i)\bBearer\s+[A-Za-z0-9._~+/-]{20,}",
          }

          failures = []
          for path in pathlib.Path(".").rglob("*"):
              if not path.is_file() or ".git" in path.parts:
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, PermissionError):
                  continue
              for name, pattern in patterns.items():
                  if re.search(pattern, text):
                      failures.append(f"{path}: {name}")

          if failures:
              print("\n".join(failures))
              sys.exit("Potential secret detected")
          PY
