<!doctype html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="TheMadDoG.tmdg : sécurité des systèmes, recherche en laboratoire, Red Team autorisée et amélioration défensive.">
  <meta name="theme-color" content="#090b10">
  <title>TheMadDoG.tmdg — Sécurité, recherche & défense>

  <script>
    (() => {
      try {
        const savedTheme = localStorage.getItem("tmdg-theme");
        const preferredTheme = matchMedia("(prefers-color-scheme: light)").matches
          ? "light"
          : "dark";

        document.documentElement.dataset.theme =
          savedTheme === "light" || savedTheme === "dark"
            ? savedTheme
            : preferredTheme;
      } catch {
        document.documentElement.dataset.theme = "dark";
      }
    })();
  </script>

  <style>
    :root {
      color-scheme: dark;
      --bg: #090b10;
      --surface: #10141c;
      --surface-alt: #171d28;
      --text: #f4f6fa;
      --muted: #a6afbd;
      --accent: #b38cff;
      --line: #2b3445;
      --warning: #ffd479;
      --width: 1160px;
      --header-height: 70px;
      --radius: 16px;
      --shadow: 0 18px 55px rgb(0 0 0 / 24%);
    }

    html[data-theme="light"] {
      color-scheme: light;
      --bg: #f5f6fa;
      --surface: #ffffff;
      --surface-alt: #edf0f6;
      --text: #171923;
      --muted: #545d6c;
      --accent: #612ec1;
      --line: #d7dce6;
      --warning: #805500;
      --shadow: 0 16px 44px rgb(29 35 50 / 9%);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: calc(var(--header-height) + 18px);
    }

    body {
      min-width: 320px;
      margin: 0;
      color: var(--text);
      background-color: var(--bg);
      background-image:
        radial-gradient(
          ellipse at 12% 0%,
          color-mix(in srgb, var(--accent) 12%, transparent),
          transparent 34rem
        );
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      font-size: 16px;
      line-height: 1.65;
    }

    a {
      color: inherit;
      text-underline-offset: 0.2em;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    :focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 3px;
    }

    ::selection {
      color: var(--bg);
      background: var(--accent);
    }

    .container {
      width: min(calc(100% - 40px), var(--width));
      margin-inline: auto;
    }

    .skip-link {
      position: fixed;
      z-index: 20;
      top: 8px;
      left: 8px;
      padding: 10px 14px;
      color: var(--bg);
      background: var(--accent);
      border-radius: 8px;
      transform: translateY(-160%);
    }

    .skip-link:focus {
      transform: translateY(0);
    }

    .site-header {
      position: sticky;
      z-index: 10;
      top: 0;
      background: color-mix(in srgb, var(--bg) 90%, transparent);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(14px);
    }

    .header-inner {
      min-height: var(--header-height);
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .brand {
      color: var(--text);
      font-weight: 850;
      letter-spacing: -0.03em;
      text-decoration: none;
      white-space: nowrap;
    }

    .brand-mark {
      margin-right: 8px;
      color: var(--accent);
      font-size: 1.3rem;
    }

    .navigation {
      display: flex;
      gap: 4px;
      margin-left: auto;
    }

    .navigation a {
      padding: 9px 10px;
      color: var(--muted);
      border-radius: 9px;
      font-size: 0.84rem;
      text-decoration: none;
    }

    .navigation a:hover,
    .navigation a[aria-current="location"] {
      color: var(--text);
      background: var(--surface-alt);
    }

    .header-actions {
      display: flex;
      gap: 8px;
    }

    .icon-button,
    .menu-button {
      min-width: 42px;
      min-height: 42px;
      display: inline-grid;
      place-items: center;
      padding: 8px 11px;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 10px;
      cursor: pointer;
    }

    .icon-button:hover,
    .menu-button:hover {
      border-color: var(--accent);
    }

    .menu-button {
      display: none;
    }

    .hero {
      padding: clamp(72px, 12vw, 144px) 0 90px;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.5fr) minmax(260px, 0.7fr);
      align-items: center;
      gap: clamp(32px, 7vw, 88px);
    }

    .eyebrow,
    .section-kicker {
      color: var(--accent);
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .eyebrow {
      margin: 0 0 18px;
    }

    h1 {
      margin: 0;
      font-size: clamp(3rem, 8.5vw, 7rem);
      line-height: 0.96;
      letter-spacing: -0.075em;
    }

    h1 span {
      display: block;
      color: var(--accent);
    }

    .hero-lead {
      max-width: 700px;
      margin: 26px 0 0;
      color: var(--muted);
      font-size: clamp(1.05rem, 2vw, 1.25rem);
    }

    .hero-lead strong {
      color: var(--text);
    }

    .tag-list {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      margin: 24px 0 0;
      padding: 0;
      list-style: none;
    }

    .tag {
      padding: 6px 10px;
      color: var(--muted);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 999px;
      font-size: 0.78rem;
    }

    .tag-accent {
      color: var(--accent);
      border-color: color-mix(in srgb, var(--accent) 50%, var(--line));
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 30px;
    }

    .button {
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 16px;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      transition:
        transform 0.18s ease,
        border-color 0.18s ease;
    }

    .button:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
    }

    .button-primary {
      color: #110b1b;
      background: var(--accent);
      border-color: var(--accent);
    }

    html[data-theme="light"] .button-primary {
      color: #ffffff;
    }

    .profile-card {
      padding: 26px;
      background:
        linear-gradient(
          145deg,
          color-mix(in srgb, var(--accent) 13%, var(--surface)),
          var(--surface) 70%
        );
      border: 1px solid color-mix(in srgb, var(--accent) 42%, var(--line));
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .profile-card h2 {
      margin: 0;
      font-size: 1rem;
    }

    .profile-card > p {
      color: var(--muted);
      font-size: 0.9rem;
    }

    .profile-meta {
      display: grid;
      gap: 12px;
      margin: 22px 0 0;
    }

    .profile-meta div {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--line);
      font-size: 0.82rem;
    }

    .profile-meta dt {
      color: var(--muted);
    }

    .profile-meta dd {
      margin: 0;
      font-weight: 700;
      text-align: right;
    }

    main > section:not(.hero) {
      padding: clamp(64px, 9vw, 104px) 0;
      content-visibility: auto;
      contain-intrinsic-size: auto 700px;
    }

    main > section:nth-of-type(even):not(.hero) {
      background: color-mix(in srgb, var(--surface) 35%, transparent);
      border-block: 1px solid var(--line);
    }

    .section-heading {
      max-width: 780px;
      margin-bottom: 34px;
    }

    .section-kicker {
      display: block;
      margin-bottom: 10px;
    }

    .section-heading h2 {
      margin: 0;
      font-size: clamp(1.9rem, 4vw, 3.2rem);
      line-height: 1.12;
      letter-spacing: -0.055em;
    }

    .section-heading p {
      margin: 16px 0 0;
      color: var(--muted);
    }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
    }

    .card {
      padding: 22px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }

    .card h3 {
      margin: 10px 0 8px;
      font-size: 1rem;
    }

    .card p {
      margin: 0;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .card-symbol {
      color: var(--accent);
      font-size: 1.25rem;
    }

    .method-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      counter-reset: method-step;
    }

    .method-step {
      min-height: 145px;
      padding: 20px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      counter-increment: method-step;
    }

    .method-step::before {
      color: var(--accent);
      content: "0" counter(method-step);
      font-size: 0.8rem;
      font-weight: 800;
    }

    .method-step h3 {
      margin: 13px 0 7px;
    }

    .method-step p {
      margin: 0;
      color: var(--muted);
      font-size: 0.85rem;
    }

    .notice {
      margin-top: 18px;
      padding: 15px 18px;
      color: var(--muted);
      background: color-mix(in srgb, var(--warning) 8%, var(--surface));
      border-left: 3px solid var(--warning);
      border-radius: 0 10px 10px 0;
      font-size: 0.88rem;
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      align-items: end;
      gap: 12px;
      margin-bottom: 20px;
    }

    .field {
      display: grid;
      gap: 6px;
    }

    .field label {
      color: var(--muted);
      font-size: 0.8rem;
      font-weight: 700;
    }

    .field input,
    .field select {
      min-width: min(280px, 80vw);
      min-height: 44px;
      padding: 9px 12px;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 9px;
    }

    .project-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .project-card {
      min-height: 180px;
      display: flex;
      flex-direction: column;
      padding: 22px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }

    .project-card[hidden] {
      display: none;
    }

    .project-top {
      display: flex;
      justify-content: space-between;
      gap: 12px;
    }

    .project-card h3 {
      margin: 0;
      font-size: 1.05rem;
    }

    .project-card p {
      color: var(--muted);
      font-size: 0.9rem;
    }

    .project-status {
      padding: 4px 9px;
      color: var(--accent);
      border: 1px solid color-mix(in srgb, var(--accent) 35%, var(--line));
      border-radius: 999px;
      font-size: 0.72rem;
      white-space: nowrap;
    }

    .project-type {
      margin-top: auto;
      color: var(--muted);
      font-size: 0.76rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .tool-list {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .tool-list li {
      padding: 9px 12px;
      color: var(--muted);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 9px;
      font-size: 0.84rem;
    }

    .proof-list {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .proof-list li {
      padding: 18px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
    }

    .proof-list strong,
    .proof-list span {
      display: block;
    }

    .proof-list span {
      color: var(--muted);
      font-size: 0.86rem;
    }

    .contact-panel {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 24px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }

    .contact-panel p {
      max-width: 680px;
      margin: 0;
      color: var(--muted);
    }

    .site-footer {
      padding: 36px 0;
      color: var(--muted);
      border-top: 1px solid var(--line);
      font-size: 0.85rem;
    }

    .footer-inner {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 14px;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 1000px) {
      :root {
        --header-height: 66px;
      }

      .menu-button {
        display: inline-grid;
      }

      .navigation {
        position: absolute;
        top: calc(var(--header-height) - 1px);
        right: 20px;
        left: 20px;
        display: none;
        padding: 10px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 12px;
        box-shadow: var(--shadow);
      }

      .navigation.open {
        display: grid;
      }

      .navigation a {
        padding: 12px;
      }

      .hero-grid {
        grid-template-columns: 1fr;
      }

      .profile-card {
        max-width: 580px;
      }

      .method-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 680px) {
      .container {
        width: min(calc(100% - 28px), var(--width));
      }

      .hero {
        padding-top: 70px;
      }

      .card-grid,
      .project-grid,
      .proof-list {
        grid-template-columns: 1fr;
      }

      .method-grid {
        grid-template-columns: 1fr;
      }

      .method-step {
        min-height: 0;
      }

      .field,
      .field input,
      .field select {
        width: 100%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
      }
    }

    @media print {
      :root {
        --bg: #ffffff;
        --surface: #ffffff;
        --text: #111111;
        --muted: #444444;
        --line: #bbbbbb;
      }

      body {
        background: #ffffff;
        font-size: 11pt;
      }

      .site-header,
      .hero-actions,
      .filters,
      .back-to-top {
        display: none !important;
      }

      main > section:not(.hero) {
        padding: 24px 0;
        content-visibility: visible;
      }

      .card,
      .project-card,
      .method-step,
      .contact-panel {
        break-inside: avoid;
        box-shadow: none;
      }
    }
  </style>
</head>

<body id="top">
  <a class="skip-link" href="#main-content">Aller au contenu</a>

  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="#top" aria-label="Accueil TheMadDoG.tmdg">
        <span class="brand-mark" aria-hidden="true">⟢</span>TheMadDoG.tmdg
      </a>

      <nav class="navigation" id="main-navigation" aria-label="Navigation principale">
        <a href="#apropos">À propos</a>
        <a href="#methode">Méthode</a>
        <a href="#domaines">Domaines</a>
        <a href="#projets">Projets</a>
        <a href="#contact">Contact</a>
      </nav>

      <div class="header-actions">
        <button
          class="icon-button"
          id="theme-toggle"
          type="button"
          aria-label="Activer le thème clair"
          title="Changer de thème"
        >
          <span aria-hidden="true">◐</span>
        </button>
        <button
          class="menu-button"
          id="menu-toggle"
          type="button"
          aria-controls="main-navigation"
          aria-expanded="false"
          aria-label="Ouvrir le menu"
        >
          <span aria-hidden="true">☰</span>
        </button>
      </div>
    </div>
  </header>

  <main id="main-content">
    <section class="hero" aria-labelledby="hero-title">
      <div class="container hero-grid">
        <div>
          <p class="eyebrow">Portfolio · Sécurité des systèmes · Recherche</p>
          <h1 id="hero-title">TheMadDoG<span>.tmdg</span></h1>
          <p class="hero-lead">
            <strong>Comprendre les systèmes. Réduire les risques.</strong><br>
            Un portfolio dédié à la sécurité, à l’expérimentation en laboratoire et aux pratiques défensives vérifiables.
          </p>
          <ul class="tag-list" aria-label="Principes et domaines">
            <li class="tag tag-accent">Autorisation d’abord</li>
            <li class="tag">Recherche en laboratoire</li>
            <li class="tag">Red Team encadrée</li>
            <li class="tag">Défense & remédiation</li>
          </ul>
          <div class="hero-actions">
            <a class="button button-primary" href="#projets">Explorer les projets</a>
            <a class="button" href="#methode">Voir la méthode</a>
          </div>
        </div>

        <aside class="profile-card" aria-label="Résumé du portfolio">
          <h2>Approche opérationnelle</h2>
          <p>
            Chaque activité commence par un mandat explicite et se termine par des constats documentés,
            des limites et des pistes de remédiation.
          </p>
          <dl class="profile-meta">
            <div><dt>Périmètre</dt><dd>Défini & autorisé</dd></div>
            <div><dt>Environnement</dt><dd>Laboratoire / mandat</dd></div>
            <div><dt>Priorité</dt><dd>Impact minimal</dd></div>
            <div><dt>Livrable</dt><dd>Preuves & recommandations</dd></div>
          </dl>
        </aside>
      </div>
    </section>

    <section id="apropos" aria-labelledby="about-title">
      <div class="container">
        <div class="section-heading">
          <span class="section-kicker">01 / Présentation</span>
          <h2 id="about-title">La sécurité, de l’analyse à l’amélioration</h2>
          <p>
            Ce portfolio présente des axes de pratique et des projets. Les statuts affichés sont déclaratifs :
            ils ne constituent pas une validation indépendante ni une preuve de certification ou d’habilitation.
          </p>
        </div>
        <div class="card-grid">
          <article class="card">
            <span class="card-symbol" aria-hidden="true">⌕</span>
            <h3>Évaluer avec méthode</h3>
            <p>Examiner des systèmes dans un cadre défini, proportionné et approuvé au préalable.</p>
          </article>
          <article class="card">
            <span class="card-symbol" aria-hidden="true">⌘</span>
            <h3>Apprendre en laboratoire</h3>
            <p>Documenter des expérimentations isolées, des limites techniques et des résultats reproductibles.</p>
          </article>
          <article class="card">
            <span class="card-symbol" aria-hidden="true">◇</span>
            <h3>Renforcer la défense</h3>
            <p>Transformer les constats en recommandations priorisées, utiles aux équipes responsables.</p>
          </article>
        </div>
      </div>
    </section>

    <section id="methode" aria-labelledby="method-title">
      <div class="container">
        <div class="section-heading">
          <span class="section-kicker">02 / Garde-fous</span>
          <h2 id="method-title">Un cycle validate-first</h2>
          <p>
            Aucune vérification active ne commence sans autorisation explicite, périmètre documenté
            et règles d’engagement comprises.
          </p>
        </div>
        <div class="method-grid">
          <article class="method-step">
            <h3>Cadrer</h3>
            <p>Confirmer mandat, cibles, exclusions, calendrier et contacts d’escalade.</p>
          </article>
          <article class="method-step">
            <h3>Observer</h3>
            <p>Choisir des actions proportionnées au besoin et à l’environnement autorisé.</p>
          </article>
          <article class="method-step">
            <h3>Valider</h3>
            <p>Effectuer uniquement les vérifications prévues, avec arrêt en cas d’impact inattendu.</p>
          </article>
          <article class="method-step">
            <h3>Restituer</h3>
            <p>Fournir preuves minimales, limites, risques et recommandations de remédiation.</p>
          </article>
        </div>
        <p class="notice">
          <strong>Règle d’arrêt :</strong> si l’autorisation, le périmètre ou les règles ne sont pas clairs,
          l’activité est suspendue jusqu’à clarification. Aucun contenu de ce site n’autorise l’intervention
          sur un système tiers.
        </p>
      </div>
    </section>

    <section id="domaines" aria-labelledby="domains-title">
      <div class="container">
        <div class="section-heading">
          <span class="section-kicker">03 / Domaines</span>
          <h2 id="domains-title">Axes de pratique & environnements</h2>
          <p>
            Ces catégories décrivent les thèmes du portfolio ; elles ne constituent ni une autorisation
            d’intervention ni une preuve d’expérience certifiée.
          </p>
        </div>
        <ul class="tool-list">
          <li>Sécurité applicative</li>
          <li>Réseaux & systèmes</li>

  <script>
    (() => {
      "use strict";

      const root = document.documentElement;
      const themeButton = document.getElementById("theme-toggle");
      const menuButton = document.getElementById("menu-toggle");
      const navigation = document.getElementById("main-navigation");
      const navLinks = [...navigation.querySelectorAll("a")];
      const searchInput = document.getElementById("project-search");
      const statusFilter = document.getElementById("project-status");
      const projectCards = [...document.querySelectorAll(".project-card")];
      const projectCount = document.getElementById("project-count");

      const normalize = (value) =>
        value
          .toLocaleLowerCase("fr")
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "");

      const setTheme = (theme) => {
        root.dataset.theme = theme;
        themeButton.setAttribute(
          "aria-label",
          `Activer le thème ${theme === "dark" ? "clair" : "sombre"}`
        );

        document.querySelector('meta[name="theme-color"]').content =
          theme === "dark" ? "#090b10" : "#f5f6fa";

        try {
          localStorage.setItem("tmdg-theme", theme);
        } catch {
          // Le thème reste actif pour la session si le stockage est indisponible.
        }
      };

      themeButton.addEventListener("click", () => {
        setTheme(root.dataset.theme === "dark" ? "light" : "dark");
      });

      const closeMenu = () => {
        navigation.classList.remove("open");
        menuButton.setAttribute("aria-expanded", "false");
        menuButton.setAttribute("aria-label", "Ouvrir le menu");
      };

      menuButton.addEventListener("click", () => {
        const isOpen = menuButton.getAttribute("aria-expanded") !== "true";

        navigation.classList.toggle("open", isOpen);
        menuButton.setAttribute("aria-expanded", String(isOpen));
        menuButton.setAttribute(
          "aria-label",
          isOpen ? "Fermer le menu" : "Ouvrir le menu"
        );
      });

      navLinks.forEach((link) => {
        link.addEventListener("click", closeMenu);
      });

      document.addEventListener("click", (event) => {
        if (
          !navigation.contains(event.target) &&
          !menuButton.contains(event.target)
        ) {
          closeMenu();
        }
      });

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") {
          closeMenu();
        }

        if (
          (event.ctrlKey || event.metaKey) &&
          event.key.toLowerCase() === "k"
        ) {
          event.preventDefault();
          document.getElementById("projets").scrollIntoView({
            behavior: "smooth"
          });
          searchInput.focus({ preventScroll: true });
        }
      });

      const filterProjects = () => {
        const query = normalize(searchInput.value.trim());
        const selectedStatus = statusFilter.value;
        let visibleCount = 0;

        projectCards.forEach((card) => {
          const searchableText = normalize(
            `${card.dataset.search} ${card.textContent}`
          );
          const matchesQuery = searchableText.includes(query);
          const matchesStatus =
            selectedStatus === "all" ||
            card.dataset.status === selectedStatus;
          const isVisible = matchesQuery && matchesStatus;

          card.hidden = !isVisible;

          if (isVisible) {
            visibleCount += 1;
          }
        });

        projectCount.textContent =
          `${visibleCount} projet${visibleCount === 1 ? "" : "s"} affiché${visibleCount === 1 ? "" : "s"}.`;
      };

      searchInput.addEventListener("input", filterProjects);
      statusFilter.addEventListener("change", filterProjects);

      document.getElementById("clear-filters").addEventListener("click", () => {
        searchInput.value = "";
        statusFilter.value = "all";
        filterProjects();
        searchInput.focus();
      });

      filterProjects();

      document.getElementById("current-year").textContent =
        String(new Date().getFullYear());

      if ("IntersectionObserver" in window) {
        const sectionObserver = new IntersectionObserver(
          (entries) => {
            entries.forEach((entry) => {
              if (!entry.isIntersecting) {
                return;
              }

              navLinks.forEach((link) => {
                if (link.hash === `#${entry.target.id}`) {
                  link.setAttribute("aria-current", "location");
                } else {
                  link.removeAttribute("aria-current");
                }
              });
            });
          },
          { rootMargin: "-30% 0px -60% 0px" }
        );

        document
          .querySelectorAll("main section[id]")
          .forEach((section) => sectionObserver.observe(section));
      }
    })();
  </script>
